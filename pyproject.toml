[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "institutional-engineering"
version = "0.1.0"
description = "Controlled role intervention experiments"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/institutional_workbench", "benchmarks", "experiments"]

[tool.hatch.build]
exclude = [
    "/experiments/roundtable_v1_bc/.scratch-cli/**",
    "/experiments/roundtable_v1_bc/.build/**",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
